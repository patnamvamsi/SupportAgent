# ADR-0015 §2 plugin manifest. Pinned in plugins/index.yaml.
id: snowflake
version: 0.1.0
description: Snowflake warehouses, tasks and credits (queuing, task failures, resource monitors).
core_api: ">=1.0,<2"
provides:
  labels:   # WP-O4: what the incident map can call a problem
    - {id: warehouse/queuing, description: "Queries queue on a saturated Snowflake warehouse; dashboards and loads are slow."}
    - {id: warehouse/credit_quota, description: "A resource monitor's credit quota is reached and the warehouse is suspended."}
    - {id: job/failure, description: "A batch or scheduled job fails outright and its output is not produced."}
  causes:   # WP-O4: what the incident map can name as a cause
    - {id: snowflake/warehouse_queuing, description: "A Snowflake warehouse is too small for concurrent load and queries queue (QUEUED in query history)."}
    - {id: snowflake/task_failure, description: "A Snowflake task fails on its own SQL: a compilation error or column mismatch, for instance after a table it reads changed."}
    - {id: snowflake/credit_quota, description: "A resource monitor suspends a warehouse because the credit quota is used up."}
  pack: snowflake
  capabilities:
    snowflake.query_history: {description: "Queries, queued and failed (ACCOUNT_USAGE.QUERY_HISTORY)"}
    snowflake.task_history: {description: "Task runs and errors (TASK_HISTORY)"}
    snowflake.warehouse_load: {description: "Warehouse load and queuing (WAREHOUSE_LOAD_HISTORY)"}
    snowflake.resource_monitors: {description: "Credit quotas and suspensions"}
  backends:
    - {capability: "snowflake.*", first_party: snowflake, access: snowflake_ro}
  extractors:
    - {match: "**/*.sql", extract: tasks_tables_warehouses}
requires:
  snowflake_ro:
    description: A role for diagnosis only.
    grant: "Role SUPPORT_RO: IMPORTED PRIVILEGES on database SNOWFLAKE (ACCOUNT_USAGE); USAGE and MONITOR on the warehouses; USAGE on the system's databases and schemas"
    target: Account
    verify_can: ["SELECT count(*) FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY"]
    verify_cannot: [resume warehouse, alter task, insert]
    find: {cmdb_class: cmdb_ci_cloud_database, name: '^(.+) \(Snowflake\)$'}   # WP-O5: one request per target found
detectors:
  min_score: 1.0
  signals:
    - {files: "**/requirements.txt", contains: "snowflake", weight: 1.0}
    - {files: "**/*.sql", contains: "(?i)create\\s+(or\\s+replace\\s+)?(task|warehouse)|resource monitor", weight: 1.0}
    - {incidents: "snowflake|warehouse", min_share: 0.05, weight: 0.5}
