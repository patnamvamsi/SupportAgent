# ADR-0015 §2 plugin manifest. Pinned in plugins/index.yaml.
id: kafka
version: 0.1.2
description: Kafka topics, consumer groups and Kafka Connect (lag, rebalances, connector failures, schema compatibility).
core_api: ">=1.0,<2"
provides:
  labels:   # WP-O4: what the incident map can call a problem
    - {id: stream/lag, description: "A streaming consumer falls behind its topic: consumer lag grows and data arrives late."}
    - {id: queue/backlog, description: "Messages or tasks back up in a queue faster than consumers drain them."}
  causes:   # WP-O4: what the incident map can name as a cause
    - {id: kafka/consumer_lag, description: "A consumer group falls behind its topic (slow or lost consumers, rebalances, stalled checkpoints) and lag grows."}
    - {id: kafka/broker_unavailable, description: "A Kafka broker or the cluster is down or unreachable; producers and consumers fail."}
  capabilities:
    kafka.consumer_lag: {description: "Lag per consumer group and partition"}
    kafka.topic_health: {description: "Partitions, ISR, broker status"}
    kafka.connect_status: {description: "Connector and task status"}
  backends:
    - {capability: "kafka.*", first_party: kafka, access: kafka_ro}
  extractors:
    - {match: "**/*.py", extract: kafka_topics_and_groups}
    - {match: "**/connector.json", extract: connect_topics_and_tables}
  discovery:   # ADR-0016: what read-only discovery's result becomes in the graph (layer 2)
    kafka.topics:
      rules:
        - node: {id: "runtime:kafka/{target}", kind: Runtime, tech: [kafka]}
        - each: {t: result.topics}
          node: {id: "topic:{t}", kind: Topic, tech: [kafka]}
        - each: {t: result.topics}
          edge: ["topic:{t}", part_of, "runtime:kafka/{target}"]
    kafka.consumer_groups:
      rules:
        - each: {g: result.groups, t: g.topics}
          edge: ["*:{g.group|strip_prefix:connect-}", consumes, "topic:{t}"]
requires:
  kafka_ro:
    description: Describe-only ACLs on the cluster.
    grant: "ACLs: DESCRIBE on Group *, DESCRIBE on Topic *, DESCRIBE_CONFIGS on Cluster; Kafka Connect REST read"
    target: Cluster
    verify_can: [describe consumer groups]
    verify_cannot: [produce, alter consumer group offsets, delete topic]
    find: {graph: Runtime, tech: kafka}   # WP-O5: one request per target found
detectors:
  min_score: 1.0
  signals:
    - {files: "**/*.py", contains: "format\\(\"kafka\"\\)|bootstrap\\.servers", weight: 1.0}
    - {files: "**/connector.json", contains: "topics", weight: 1.0}
    - {files: "**/pom.xml", contains: "spring-kafka", weight: 1.0}   # WP-O8: Spring Kafka services
    - {incidents: "kafka|consumer (group|lag)", min_share: 0.05, weight: 0.5}
