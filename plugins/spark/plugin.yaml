# ADR-0015 §2 plugin manifest. Pinned in plugins/index.yaml.
id: spark
version: 0.2.0
description: Apache Spark batch and streaming jobs (executor OOM, skew, stalled streaming queries).
core_api: ">=1.0,<2"
status: evaluated   # its pack passes its lab (packs/spark/evals)
provides:
  labels: []   # a failed job is the core batch/failure label
  causes:   # WP-O4: what the incident map can name as a cause
    - {id: spark/executor_oom, description: "Spark executors run out of memory (ExecutorLostFailure, container killed for exceeding memory), often from data skew."}
    - {id: spark/shuffle_failure, description: "A Spark job fails fetching shuffle blocks (FetchFailedException) after executor or disk loss."}
  pack: spark
  capabilities:
    spark.applications:
      description: The service's recent applications, their state, and the executors each lost and why
      result_schema:
        type: object
        required: [apps]
        properties:
          apps:
            type: array
            items:
              type: object
              required: [name, state, failure, executor_losses]
              properties:
                name: {type: string}
                state: {type: string, enum: [RUNNING, SUCCEEDED, FAILED]}
                failure: {type: string}
                executor_losses:
                  type: array
                  items:
                    type: object
                    required: [executor, reason]
                    properties:
                      executor: {type: string}
                      reason: {type: string}
    spark.streaming_progress: {description: "Structured Streaming query progress"}
  backends:
    - {capability: "spark.*", mcp: {image: "ghcr.io/acme/spark-history-mcp:0.1", tools: [applications, streaming_progress]}, access: spark_history_ro}
  extractors:
    - {match: "**/*.py", extract: spark_reads_and_writes}
    - {match: "**/deploy/emr.yaml", extract: emr_cluster}
requires:
  spark_history_ro:
    description: Read access to the cluster's Spark History Server.
    grant: "Read-only access to the Spark History Server UI and REST API"
    target: Runtime
    verify_can: [list applications]
    verify_cannot: [kill application, submit step]
    find: {graph: Runtime, tech: spark}   # WP-O5: one request per target found
detectors:
  min_score: 1.0
  signals:
    - {files: "**/requirements.txt", contains: "pyspark", weight: 1.0}
    - {files: "**/*.py", contains: "SparkSession", weight: 1.0}
    - {incidents: "spark|executor", min_share: 0.05, weight: 0.5}
