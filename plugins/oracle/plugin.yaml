# ADR-0015 §2 plugin manifest. Pinned in plugins/index.yaml.
id: oracle
version: 0.2.0
description: Oracle Database (locks and deadlocks, tablespaces, ORA- errors, plan regressions).
core_api: ">=1.0,<2"
status: evaluated   # WP-O6a: its pack passes its lab (packs/oracle/evals)
provides:
  pack: oracle   # WP-O6a: hypotheses, probes, runbooks and its lab (packs/oracle)
  causes:   # WP-O4: what the incident map can name as a cause
    - {id: oracle/lock_contention, description: "Sessions block each other on row locks or deadlock (ORA-00060, enq: TX - row lock contention); a DBA kills the blocking session."}
    - {id: oracle/tablespace_full, description: "A tablespace or datafile is full, so writes fail (ORA-01653, ORA-01654); adding a datafile fixes it."}
    - {id: oracle/plan_regression, description: "A SQL statement's execution plan changed (after statistics or an upgrade) and it became slow; pinning the old plan fixes it."}
    - {id: oracle/listener_down, description: "The database instance or its listener is down or unreachable (ORA-12541, ORA-12514)."}
  capabilities:
    oracle.sessions: {description: "Sessions and blocking chains (V$SESSION)"}
    oracle.locks: {description: "Locks and waits (V$LOCK, ASH)"}
    oracle.top_sql: {description: "Top SQL by elapsed time and plan changes (V$SQL, AWR)"}
    oracle.tablespaces: {description: "Tablespace usage (DBA_TABLESPACE_USAGE_METRICS)"}
  backends:
    - {capability: "oracle.*", first_party: oracle_ro, access: oracle_ro}
  extractors:
    - {match: "**/application*.yml", extract: jdbc_oracle_datasources}
    - {match: "cmdb:cmdb_ci_db_ora_instance", extract: databases}
requires:
  oracle_ro:
    description: A read-only diagnostic account on each database.
    grant: "CREATE SESSION; SELECT on V_$SESSION, V_$LOCK, V_$SQL, V_$ACTIVE_SESSION_HISTORY, DBA_HIST_SQLSTAT, DBA_TABLESPACE_USAGE_METRICS"
    target: Database
    verify_can: ["SELECT count(*) FROM V$SESSION"]
    verify_cannot: [insert, update, delete, ddl]
    find: {graph: Database, tech: oracle}   # WP-O5: one request per target found
detectors:
  min_score: 1.0
  signals:
    - {files: "**/application*.yml", contains: "jdbc:oracle", weight: 1.0}
    - {files: "**/pom.xml", contains: "ojdbc", weight: 0.5}
    - {cmdb_class: cmdb_ci_db_ora_instance, weight: 1.0}
    - {incidents: "ORA-\\d{5}", min_share: 0.05, weight: 1.0}
