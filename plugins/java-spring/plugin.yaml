# ADR-0015 §2 plugin manifest. Pinned in plugins/index.yaml.
id: java-spring
version: 0.1.0
description: Java services on Spring Boot (JVM heap and GC, thread and connection pools, Spring errors).
core_api: ">=1.0,<2"
provides:
  labels:   # WP-O4: what the incident map can call a problem
    - {id: app/memory, description: "The service runs out of memory: OutOfMemoryError, OOMKilled pods, restarts as heap fills."}
  causes:   # WP-O4: what the incident map can name as a cause
    - {id: jvm/heap_exhaustion, description: "The JVM heap fills up (java.lang.OutOfMemoryError, GC overhead limit exceeded) and the service restarts."}
    - {id: jvm/connection_pool_exhaustion, description: "The service's database connection pool (HikariCP) has no free connections; requests wait and time out."}
    - {id: jvm/thread_pool_exhaustion, description: "Request worker threads are all busy or blocked; the service stops accepting requests."}
    - {id: jvm/gc_pauses, description: "Long garbage-collection pauses stall the service without running out of heap."}
  needs: [logs.search, metrics.query, k8s.pod_status]
  extractors:
    - {match: "**/pom.xml", extract: service_tech}
    - {match: "**/application*.yml", extract: service_calls_and_datasources}
detectors:
  min_score: 1.0
  signals:
    - {files: "**/pom.xml", contains: "spring-boot", weight: 1.0}
    - {files: "**/build.gradle*", contains: "spring-boot", weight: 1.0}
    - {incidents: "java\\.lang\\.|OutOfMemoryError|HikariPool|NullPointerException", min_share: 0.05, weight: 0.5}
