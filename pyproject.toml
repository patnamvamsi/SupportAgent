[project]
name = "supportagent"
version = "0.0.0"
description = "SupportAgent — an application support analyst. The docs/ tree is the product; this is the v0.0 walking skeleton."
readme = "README.md"
# Pinned to the 3.12 toolchain the spec standardizes on (10-wp WP-000,
# 05 §1), not just floored at it: the CI matrix and the Docker base image
# both pin 3.12, so a 3.13 interpreter is a deliberate change, not a
# silent upgrade.
requires-python = ">=3.12,<3.13"
authors = [{ name = "SupportAgent team" }]
# Runtime dependency allowlist per 05 §1 — adding anything else requires an ADR.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
    "cryptography>=42.0",
    "python-ulid>=2.7",
    "authlib>=1.3",
    "cel-python>=0.1",
    "anthropic>=0.34",
    "openai>=1.30",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-socket>=0.6",
    "hypothesis>=6.100",
    "respx>=0.21",
    "testcontainers>=4.4",
    "mutmut>=3.0",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20240311",
    "mcp==2.3.0",
]

[project.scripts]
supportagent = "supportagent.entrypoints.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so test helpers import as ``tests.builders``
# (a PEP 420 namespace package — no ``__init__.py`` needed in tests/).
pythonpath = ["."]
# Sockets are disabled by default: unit/property/contract suites run with no
# network and no Docker (04 §1). Live-endpoint suites opt in per-run.
# --allow-unix-socket: the in-memory ServiceNow ASGI fake (adapters/fakes) runs
# its async handlers on a selector event loop whose waker is a Unix
# socketpair — an in-memory construct, not a network call, so it is permitted
# while real sockets stay blocked (04 §1 "no network").
# --strict-markers: a marker that is not defined here is a collection error,
# so a typo cannot silently re-scope a suite.
addopts = ["--disable-socket", "--allow-unix-socket", "--strict-markers", "-ra"]
markers = [
    "unit: pure/domain and service tests with fakes; <5 ms each (04 §1)",
    "property: Hypothesis property tests (04 §1)",
    "contract: one suite per port, fake and real adapter (04 §4)",
    "invariant: ARCH §2 INV-01..06 against a real DB, sqlite and postgres (04 §6)",
    "integration: use case + real DB + fake externals through bootstrap (04 §1)",
    # `sn` composes with integration (`-m "integration and sn"`) — the
    # ServiceNow re-recording selection (04 §3, `make record-sn`). Declared
    # now because `--strict-markers` makes an undeclared marker an error.
    "sn: ServiceNow re-recording against a developer instance (04 §3)",
    "e2e: supportagent run in Docker + FakeServiceNow + FakeOIDC (04 §1)",
    "faults: SUPPORTAGENT_FAULT_INJECT scenarios (INV-05)",
    "soak: 1,000-alert storm (ARCH §19)",
    "eval_smoke: 25-50 case wiring + invariants suite (04 §1)",
    "eval_quality: 150-250 case holdout, real LLM (v0.1)",
]

[tool.coverage.run]
branch = true
source = ["src/supportagent"]

[tool.mutmut]
# The nightly mutation job (04 §6) targets the domain kernel, whose
# unit/property tests must kill the mutants. mutmut 3.8.0's `run` CLI has
# no `--paths-to-mutate` flag, so the target comes from this section.
# `source_paths` is the 3.8.0 key (`paths_to_mutate` is deprecated).
source_paths = ["src/supportagent/domain"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
