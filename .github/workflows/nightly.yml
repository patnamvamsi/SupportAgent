# Nightly (04 §6): the storm soak on both engines and a fresh install; both block a release.
# eval_quality, mutation testing and the fixture re-record check join this
# workflow with their WPs (WP-104, 04 §6).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # release.yml: the soak blocks a release (04 §6).
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"

jobs:
  soak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: storm soak --db=${{ matrix.db }} (ARCH §19)
        run: |
          uv run pytest -m soak --db=${{ matrix.db }} -s \
            --allow-unix-socket --allow-hosts=127.0.0.1,localhost

  fresh-install:
    # The README quickstart, unattended, on a clean runner: ./install.sh with
    # an answers file (demo ServiceNow, no model), then /healthz, /readyz, the
    # sign-in redirect and Keycloak's realm. scripts/fresh-install-test.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fresh install (Linux, Docker Engine + Compose v2)
        run: scripts/fresh-install-test.sh
