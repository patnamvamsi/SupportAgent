# Nightly (04 §6): the storm soak on both engines; it blocks a release.
# eval_quality, mutation testing and the fixture re-record check join this
# workflow with their WPs (WP-104, 04 §6).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"

jobs:
  soak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: storm soak --db=${{ matrix.db }} (ARCH §19)
        run: |
          uv run pytest -m soak --db=${{ matrix.db }} -s \
            --allow-unix-socket --allow-hosts=127.0.0.1,localhost
