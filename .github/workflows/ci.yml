# CI pipeline — 04-test-strategy §6 (jobs and gates; hard = merge blocked).
#
#   lint ─► typecheck ─► unit+property ─► contract ─┬─► invariants[sqlite] ─┬─► integration ─► e2e
#                                                  └─► invariants[postgres]┘
#   paths(prompts/**, taxonomy/**, routing, llm config) ─► eval (v0.0: smoke)
#   security: pip-audit, bandit, gitleaks — hard
#
# Coverage: 04 §7 sets per-package floors (domain ≥95, app ≥90, adapters ≥80,
# overall ≥85). The hard gate activates in WP-001, when the first package
# carries real code; in WP-000 coverage is reported (DoD: CI green on an
# empty codebase).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Minimal scopes. gitleaks-action on pull_request events fetches the PR
  # diff via the API and needs pull-requests: read (403 without it).
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run mypy --strict src tests

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: import-linter contracts (01 §2)
        run: uv run lint-imports

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: unit + property (no network — pytest-socket disabled in addopts)
        run: uv run pytest -m "unit or property" --cov --cov-report=term-missing

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # Exit 5 = "no tests collected yet" (suite lands with its WP); 0 and 5 pass.
      - name: contract (04 §4)
        run: |
          rc=0
          uv run pytest -m contract || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; then exit 0; else exit "$rc"; fi

  invariants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # Postgres engine via testcontainers (04 §3); ubuntu runners ship Docker.
      # Exit 5 = "no invariant tests yet" (they land red-first with WP-003+).
      - name: invariants --db=${{ matrix.db }} (ARCH §19)
        run: |
          rc=0
          uv run pytest -m invariant --db=${{ matrix.db }} || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; then exit 0; else exit "$rc"; fi

  integration:
    runs-on: ubuntu-latest
    needs: [unit, invariants]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: integration
        run: |
          rc=0
          uv run pytest -m integration || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; then exit 0; else exit "$rc"; fi

  e2e:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: e2e
        run: |
          rc=0
          uv run pytest -m e2e || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; then exit 0; else exit "$rc"; fi

  eval:
    # Hard when triggered by path (04 §6): prompts/**, taxonomy/**, routing,
    # llm config. The `supportagent eval` command and data land with WP-016;
    # the job stays dormant until those paths change in a PR.
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Path trigger (04 §6)
        id: filter
        run: |
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          if git diff --name-only "$base" HEAD | grep -Eq '^(prompts|taxonomy|catalog|llm|evals)/'; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.filter.outputs.triggered == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
        if: steps.filter.outputs.triggered == 'true'
      - name: eval smoke (v0.0)
        if: steps.filter.outputs.triggered == 'true'
        run: uv run supportagent eval run --suite smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes -o reqs.txt
          uv run pip-audit -r reqs.txt
      - name: bandit
        run: uv run bandit -r src
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Walking-skeleton image (10-wp WP-000 DoD: `supportagent --version` in a
    # container). Full image gate grows with the API/worker WPs.
    runs-on: ubuntu-latest
    needs: [e2e, security]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build the supportagent image
        run: docker build -f docker/Dockerfile -t supportagent:ci .
