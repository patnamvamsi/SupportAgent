name: Bug report
description: Something SupportAgent does wrong or fails to do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Don't paste ticket contents, credentials or personal data. Redact them first. Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: Commands, config (secrets removed) and the smallest input that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `supportagent --version`, or the image tag.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it's installed
      options: [install.sh on a laptop, Docker Compose on a server, a cloud container service, from source]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: supportagent doctor output (redacted)
      render: text
