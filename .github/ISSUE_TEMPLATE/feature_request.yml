name: Feature or extension request
description: Something SupportAgent should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, on which stack, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Many gaps close with a pack, a plugin or a read-only tool instead of a core change (CONTRIBUTING.md).
