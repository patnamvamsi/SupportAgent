global:
  scrape_interval: 15s

scrape_configs:
  # The catalog's demo service: lab and contract queries use {service="demo-api"}.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {service: demo-api}
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: {service: demo-grafana}
