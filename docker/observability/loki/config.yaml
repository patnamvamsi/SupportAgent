# BL-050: single-process Loki for the lab stack (filesystem storage, 7-day retention).
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 168h
  # The contract test pushes lines stamped "now"; the shipper tails files.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
# WP-215: reviewed detector rules (`supportagent onboard detectors --apply`)
# are read per tenant from /etc/loki/rules/<tenant>/ ("fake" with auth off);
# compose.exporters.yaml mounts DETECTOR_RULES_DIR/loki there. Firing alerts go
# to Alertmanager, which compose.exporters.yaml's `alerts` profile runs.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
