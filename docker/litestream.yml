# Litestream continuous replication of the SQLite system of record (ARCH §8.1).
# v0.1: an ops item, used with `docker compose --profile litestream up`; the
# named, CI-tested point-in-time restore is v0.2. Restore runbook:
# docs/ops/restore.md. Credentials come from the environment, never this file.
dbs:
  - path: /data/sa.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: supportagent/sa.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 168h          # 7 days of WAL history
        sync-interval: 1s
