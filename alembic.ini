# Alembic configuration (03 §4).
#
# The database URL is *never* checked in (05 §6: secrets are environment
# variables, not files). ``supportagent migrate`` (bootstrap.run_migrations)
# resolves the URL from the config file + the ``SUPPORTAGENT_DB_URL``
# environment variable and passes it to Alembic at run time.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# Logging is configured in the standard way; the app itself does not log
# through Alembic's loggers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
