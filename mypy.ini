# Type checking — 05-engineering-standards §6 (frozen): mypy --strict on src and tests.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True

# 01 §2: domain and ports are the type-safe core — no explicit `Any`.
[mypy-supportagent.domain.*]
disallow_any_explicit = True

[mypy-supportagent.ports.*]
disallow_any_explicit = True

# mypy's built-in pydantic support rewrites every model's __init__ as
# ``def __init__(self, <fields...>, **data: Any)``; the rewritten explicit
# `Any` then trips disallow_any_explicit on the class line (mypy/pydantic 2.14
# artifact, not code we wrote). The rule is kept for all other domain/ports
# code and is enforced there by ruff ANN401 as well.
[mypy-supportagent.domain.model.*]
disallow_any_explicit = False

# config/ is the raw-YAML boundary: the loader plumbs `dict[str, Any]` from
# yaml.safe_load into the pydantic models (ADR-0004 keeps yaml out of domain/
# and ports/), so the same exception applies there.
[mypy-supportagent.config.*]
disallow_any_explicit = False
