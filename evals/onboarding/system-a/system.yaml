# The onboarding manifest (ADR-0015 §1) for reference System A.
system:
  id: payments-platform
  name: 'System A: Payments Platform'
  owners:
  - team-payments@acme.example
sources:
  servicenow:
    business_service: Payments
    assignment_groups:
    - PAY-L2
    history: 12mo
    include:
    - incident
    - problem
    - change_request
    - cmdb_ci
  confluence:
  - space: PAY
  - space: PAYARCH
  git:
  - repo: github:acme/payments-*
    paths:
    - '**/pom.xml'
    - '**/application*.yml'
    - '**/helm/**'
    - package.json
    - angular.json
    - '**/environment*.ts'
access: []
budget:
  llm_tokens: 20000000
  wall_clock: 6h
