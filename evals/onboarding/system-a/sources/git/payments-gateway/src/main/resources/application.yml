spring:
  application: {name: payments-gateway}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': {allowedOrigins: ["https://payments-portal.acme.com"]}
      routes:
        - {id: orders, uri: "http://orders-service.payments.svc:8080", predicates: ["Path=/api/orders/**"]}
        - {id: payments, uri: "http://payment-service.payments.svc:8080", predicates: ["Path=/api/payments/**"]}
        - {id: customers, uri: "http://customer-service.payments.svc:8080", predicates: ["Path=/api/customers/**"]}
