# The onboarding manifest (ADR-0015 §1) for reference System C.
system:
  id: shipment-tracking
  name: 'System C: Shipment Tracking'
  owners:
  - team-logistics@acme.example
sources:
  servicenow:
    business_service: Logistics
    assignment_groups:
    - LOG-L2
    history: 12mo
    include:
    - incident
    - problem
    - change_request
    - cmdb_ci
  confluence:
  - space: LOG
  git:
  - repo: github:acme-logistics/*
    paths:
    - '**/package.json'
    - '**/config/*.json'
    - '**/.env.example'
    - '**/helm/**'
access: []
budget:
  llm_tokens: 20000000
  wall_clock: 6h
