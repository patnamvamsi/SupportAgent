# System D: meter readings, streamed. feed -> broker -> writer -> store, read by api.
services:
  broker:
    image: apache/kafka:3.8.0
    restart: unless-stopped
  store:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "readings"]
  feed:
    build: {context: ./feed}
    depends_on: [broker]
    restart: unless-stopped
    environment:
      BROKER: broker:9092
  writer:
    build: {context: ./writer}
    depends_on:
      broker: {condition: service_started}
      store: {condition: service_healthy}
    restart: unless-stopped
    environment:
      BROKER: broker:9092
      DATABASE_URL: postgresql://readings@store/readings
  api:
    build: {context: ./api}
    depends_on: [store]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://readings@store/readings
  # Run by hand after an outage: re-publishes what the writer's cursor missed.
  backfill:
    build: {context: ./backfill}
    profiles: [manual]
    depends_on: [broker, store]
