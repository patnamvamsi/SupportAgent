# Release and promotion gates (ARCH §11, CAP §4.7). Every number is
# PROVISIONAL until ADR-0003 sets it from the v0.0 shadow run on the
# partner's last 50 incidents; flip `provisional` to false then.
version: 1
promotion:                 # shadow -> assisted (WP-115); the partner still decides
  provisional: true
  overall: {min_lower_bound: 0.75, min_cases: 60}
  bands:
    P1-P2: {min_lower_bound: 0.75, min_cases: 20}
quality:                   # the holdout quality suite (WP-104; ARCH §11, all prov.)
  - {name: p1p2_classification, band: P1-P2, metric: classification, min_lb: 0.90, min_cases: 35}
  - {name: p1p2_severity, band: P1-P2, metric: severity, min_lb: 0.85, min_cases: 22}
lab:                       # the incident lab (ADR-0011 §5, WP-M02); all provisional
  default:
    min_cases: 10          # below this, the lower-bound gates aren't applied
    min_classification_lb: 0.70
    min_root_cause_lb: 0.60
    max_false_cause_rate: 0.0   # a confident wrong root cause is never acceptable
    no_regressions: true        # a scenario that passed in the baseline must still pass
    min_retrieval_recall: 0.75  # WP-M08: mean recall@k of each scenario's guidance docs
