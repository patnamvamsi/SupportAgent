# Python microservices and web servers on Postgres (ADR-0011 §1, WP-M03).
# This is the WP-M01 skeleton: the manifest validates and services can select
# it, but it adds no knowledge yet. WP-M03 adds the taxonomy, hypotheses,
# preclass rules, runbooks, prompt fragments and lab scenarios; WP-M04 adds
# the tools it names.
id: python-postgres
version: 0.1.0
description: Python web services and workers (FastAPI, Flask, Django, gunicorn, uvicorn, Celery) on PostgreSQL.
applies_to:
  stack: [python, fastapi, flask, django, gunicorn, uvicorn, celery, postgres]
tools:
  - logs.grep
  - postgres.activity
  - postgres.locks
  - postgres.slow_queries
  - postgres.replication
  - postgres.storage
  - metrics.query
  - k8s.pod_status
  - changes.recent
knowledge:
  spaces: [platform]
  labels: [postgres, python]
