# Python microservices and web servers on Postgres (ADR-0011 §1, WP-M03).
# Database failures keep the common labels (database/saturation, /latency,
# /failure) so routing and calibration stay put; this pack adds the
# app-layer labels, the hypotheses and checks for both, and the lab scenarios.
id: python-postgres
version: 1.2.0
description: Python web services and workers (FastAPI, Flask, Django, gunicorn, uvicorn, Celery) on PostgreSQL.
applies_to:
  stack: [python, fastapi, flask, django, gunicorn, uvicorn, celery, postgres]
taxonomy: taxonomy.yaml
hypotheses: hypotheses.yaml
preclass: preclass_rules.yaml
runbooks: runbooks/
probes: probes.yaml
prompts: {classify: classify.md}
tools:
  - logs.grep
  - logs.search
  - postgres.activity
  - postgres.locks
  - postgres.slow_queries
  - postgres.replication
  - postgres.storage
  - metrics.query
  - k8s.pod_status
  - changes.recent
knowledge:
  spaces: [platform]
  labels: [postgres, python]
evals: evals/
