# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-connection-load
pack: python-postgres
split: tune
description: Pool exhausted by a scale-out that multiplied workers against a fixed max_connections.
incident:
  subject: 'checkout-api: too many clients'
  priority: '2'
  body: 'psycopg.OperationalError: FATAL: sorry, too many clients already'
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.activity:
    result:
      database: orders
      total: 497
      max_connections: 500
      by_state:
        active: 491
        idle in transaction: 6
      idle_in_transaction: 6
      waiting: 0
      oldest_xact_age_s: 4.0
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  metrics.query:
    result:
      query: replicas
      series:
      - labels: {}
        value: 24
      count: 1
      max_value: 24
truth:
  classification: database/saturation
  severity: P2
  root_cause: pg_connection_load
  verdict: SUPPORTED
  must_cite:
  - postgres.activity
  must_not_claim:
  - pg_idle_in_transaction_leak
why: 'Connections are busy, not idle in transaction: real load at the limit after the HPA scaled out.'
