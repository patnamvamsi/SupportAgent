# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-slow-query-after-migration
pack: python-postgres
split: tune
description: A migration dropped an index; the order lookup now scans the table.
incident:
  subject: checkout-api latency p95 8s
  priority: '3'
  body: Order history page takes 8+ seconds since this morning.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.slow_queries:
    result:
      database: orders
      available: true
      queries:
      - queryid: '9131'
        calls: 22000
        mean_ms: 3480.2
        total_ms: 76564400.0
        query: SELECT * FROM orders WHERE customer_id = $1 ORDER BY created_at DESC
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  postgres.storage:
    result:
      database: orders
      size_bytes: 48000000000
      tables:
      - name: order_events
        live: 9600
        dead: 400
        dead_ratio: 0.04
        last_autovacuum: null
      max_dead_ratio: 0.04
  postgres.replication:
    result:
      database: orders
      is_replica: false
      replicas:
      - name: orders-replica-1
        state: streaming
        lag_s: 0.4
      max_lag_s: 0.4
  changes.recent:
    result:
      window_min: 180
      changes:
      - source: github
        kind: deploy
        ref: migrate-0412
        at: '2026-01-01T00:00:00+00:00'
        minutes_ago: 95
        actor: null
        environment: shop
      count: 1
truth:
  classification: database/latency
  severity: P3
  root_cause: pg_slow_query_regression
  verdict: SUPPORTED
  must_cite:
  - postgres.slow_queries
  must_not_claim:
  - pg_lock_contention
why: 'One statement averages 3.5 s over 22k calls: a plan regression, consistent with the morning migration.'
