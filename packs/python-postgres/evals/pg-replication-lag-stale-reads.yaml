# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-replication-lag-stale-reads
pack: python-postgres
split: tune
description: Reads served from a replica 4 minutes behind the primary.
incident:
  subject: customers see old order status
  priority: '3'
  origin: ticket
  body: Customers say their order still shows 'pending' minutes after payment succeeded.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.slow_queries:
    result:
      database: orders
      available: true
      queries: []
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  postgres.storage:
    result:
      database: orders
      size_bytes: 48000000000
      tables:
      - name: order_events
        live: 9600
        dead: 400
        dead_ratio: 0.04
        last_autovacuum: null
      max_dead_ratio: 0.04
  postgres.replication:
    result:
      database: orders
      is_replica: false
      replicas:
      - name: orders-replica-1
        state: streaming
        lag_s: 241.0
      max_lag_s: 241.0
truth:
  classification: database/latency
  severity: P3
  root_cause: pg_replication_lag
  verdict: SUPPORTED
  must_cite:
  - postgres.replication
  must_not_claim:
  - pg_slow_query_regression
why: Nothing is slow or locked; the replica's replay lag is 4 minutes, so reads are stale.
