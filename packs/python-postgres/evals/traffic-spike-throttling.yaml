# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: traffic-spike-throttling
pack: python-postgres
split: holdout
description: A marketing email tripled traffic; the service sheds load with 429s.
incident:
  subject: checkout-api returning 429
  priority: '2'
  body: Rate limiter rejecting requests since 10:02.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  metrics.query:
    result:
      query: req ratio
      series:
      - labels: {}
        value: 3.8
      count: 1
      max_value: 3.8
  postgres.activity:
    result:
      database: orders
      total: 140
      max_connections: 500
      by_state:
        active: 138
        idle in transaction: 2
      idle_in_transaction: 2
      waiting: 0
      oldest_xact_age_s: 3.0
truth:
  classification: request/capacity
  severity: P2
  root_cause: traffic_spike
  verdict: SUPPORTED
  must_cite:
  - metrics.query
  must_not_claim:
  - pg_connection_load
why: Requests are 3.8x the same time yesterday; the database has headroom.
