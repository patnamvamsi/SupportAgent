# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: celery-backlog
pack: python-postgres
split: tune
description: Celery workers fall behind; billing tasks wait 40 minutes.
incident:
  subject: invoices delayed
  priority: '3'
  body: Celery queue length on billing grows; invoices go out 40 minutes late.
service:
  name: billing-worker
  stack:
  - python
  - celery
  - postgres
  databases:
  - orders
  log_paths:
  - logs/billing-worker
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=billing-worker
world:
  metrics.query:
    result:
      query: celery_queue_length
      series:
      - labels: {}
        value: 18250.0
      count: 1
      max_value: 18250.0
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
truth:
  classification: queue/backlog
  severity: P3
  root_cause: celery_backlog
  verdict: SUPPORTED
  must_cite:
  - metrics.query
  must_not_claim:
  - pg_lock_contention
why: 18k tasks queued with no lock contention behind them.
