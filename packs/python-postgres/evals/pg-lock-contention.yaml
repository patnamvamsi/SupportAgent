# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-lock-contention
pack: python-postgres
split: tune
description: A migration's ALTER TABLE waits behind a long transaction; every write queues.
incident:
  subject: orders writes hanging
  priority: '2'
  body: Requests to POST /orders hang for 30s then 504.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.slow_queries:
    result:
      database: orders
      available: true
      queries:
      - queryid: '77'
        calls: 40
        mean_ms: 210.0
        total_ms: 8400.0
        query: UPDATE orders SET status = $1
  postgres.locks:
    result:
      database: orders
      blocked: 38
      blockers:
      - pid: 4412
        blocking: 38
        state: idle in transaction
        xact_age_s: 1260.0
  postgres.storage:
    result:
      database: orders
      size_bytes: 48000000000
      tables:
      - name: order_events
        live: 9600
        dead: 400
        dead_ratio: 0.04
        last_autovacuum: null
      max_dead_ratio: 0.04
  postgres.replication:
    result:
      database: orders
      is_replica: false
      replicas:
      - name: orders-replica-1
        state: streaming
        lag_s: 0.4
      max_lag_s: 0.4
truth:
  classification: database/latency
  severity: P2
  root_cause: pg_lock_contention
  verdict: SUPPORTED
  must_cite:
  - postgres.locks
  must_not_claim:
  - pg_slow_query_regression
why: 38 sessions wait on one 21-minute transaction; no query is slow on its own.
