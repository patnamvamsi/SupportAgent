# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: control-noisy-5xx-blip
pack: python-postgres
split: tune
description: A short 5xx blip with every tested cause negative.
incident:
  subject: checkout-api error rate alert
  priority: '4'
  body: Error rate above 1% for 2 minutes, then recovered.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  metrics.query:
    result:
      query: req ratio
      series:
      - labels: {}
        value: 1.1
      count: 1
      max_value: 1.1
  postgres.activity:
    result:
      database: orders
      total: 80
      max_connections: 500
      by_state:
        active: 78
        idle in transaction: 2
      idle_in_transaction: 2
      waiting: 0
      oldest_xact_age_s: 3.0
truth:
  classification: request/capacity
  severity: P4
  root_cause: null
  verdict: CONSISTENT_UNCONFIRMED
  must_cite: []
  must_not_claim:
  - traffic_spike
  - pg_connection_load
why: 'Traffic is normal and the pool has headroom: no tested cause holds (ARCH §5).'
