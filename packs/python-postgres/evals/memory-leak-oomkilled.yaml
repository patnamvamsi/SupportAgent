# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: memory-leak-oomkilled
pack: python-postgres
split: holdout
description: 'A slow memory leak: pods are OOMKilled every few hours; no recent change.'
incident:
  subject: checkout-api pods restarting
  priority: '3'
  body: Pods restart with exit code 137 roughly every 4 hours.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  changes.recent:
    result:
      window_min: 180
      changes: []
      count: 0
  k8s.pod_status:
    result:
      namespace: shop
      selector: app=checkout-api
      pods:
      - name: pod-0
        phase: Running
        ready: true
        restarts: 17
        last_termination: OOMKilled
      - name: pod-1
        phase: Running
        ready: true
        restarts: 0
        last_termination: OOMKilled
      - name: pod-2
        phase: Running
        ready: true
        restarts: 0
        last_termination: OOMKilled
      - name: pod-3
        phase: Running
        ready: true
        restarts: 0
        last_termination: null
      restarts_total: 17
      oomkilled: 3
      not_ready: 0
truth:
  classification: app/memory
  severity: P3
  root_cause: app_oom_restarts
  verdict: SUPPORTED
  must_cite:
  - k8s.pod_status
  must_not_claim:
  - recent_rollout
why: 'OOMKilled restarts with no rollout in the window: a leak, not a release.'
