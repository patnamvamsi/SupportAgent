# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-table-bloat
pack: python-postgres
split: tune
description: Autovacuum fell behind on a hot table; scans read mostly dead tuples.
incident:
  subject: order_events queries slowing week over week
  priority: '4'
  body: Gradual slowdown of event queries; no deploys this week.
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.slow_queries:
    result:
      database: orders
      available: true
      queries:
      - queryid: '51'
        calls: 9000
        mean_ms: 640.0
        total_ms: 5760000.0
        query: SELECT * FROM order_events WHERE order_id = $1
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  postgres.storage:
    result:
      database: orders
      size_bytes: 48000000000
      tables:
      - name: order_events
        live: 1000000
        dead: 4300000
        dead_ratio: 0.81
        last_autovacuum: null
      max_dead_ratio: 0.81
  postgres.replication:
    result:
      database: orders
      is_replica: false
      replicas:
      - name: orders-replica-1
        state: streaming
        lag_s: 0.4
      max_lag_s: 0.4
truth:
  classification: database/latency
  severity: P4
  root_cause: pg_table_bloat
  verdict: SUPPORTED
  must_cite:
  - postgres.storage
  must_not_claim:
  - recent_rollout
why: 81% dead tuples on order_events; queries are slower but under the regression threshold.
