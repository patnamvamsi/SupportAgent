# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: worker-timeout-slow-upstream
pack: python-postgres
split: tune
description: Gunicorn workers time out waiting on a slow payment provider.
incident:
  subject: checkout-api 504s
  priority: '2'
  body: '[CRITICAL] WORKER TIMEOUT (pid:212); upstream request timeout'
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  metrics.query:
    result:
      query: upstream p95
      series:
      - labels: {}
        value: 11.4
      count: 1
      max_value: 11.4
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  postgres.activity:
    result:
      database: orders
      total: 60
      max_connections: 500
      by_state:
        active: 58
        idle in transaction: 2
      idle_in_transaction: 2
      waiting: 0
      oldest_xact_age_s: 3.0
truth:
  classification: app/worker_timeout
  severity: P2
  root_cause: slow_upstream
  verdict: SUPPORTED
  must_cite:
  - metrics.query
  must_not_claim:
  - pg_lock_contention
  - pg_idle_in_transaction_leak
why: 'The payment client''s p95 is 11 s while the database is idle: workers block on the upstream.'
