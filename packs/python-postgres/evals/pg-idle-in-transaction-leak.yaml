# Lab scenario (ADR-0011 §5, WP-M03). Edit only with a `why` note.
id: pg-idle-in-transaction-leak
pack: python-postgres
split: tune
description: Pool full of idle-in-transaction sessions after a code path stopped committing.
incident:
  subject: 'checkout-api 500s: connection pool exhausted'
  priority: '2'
  body: 'sqlalchemy.exc.TimeoutError: QueuePool limit of size 20 overflow 10 reached, connection timed out'
service:
  name: checkout-api
  stack:
  - python
  - fastapi
  - gunicorn
  - postgres
  databases:
  - orders
  log_paths:
  - logs/checkout-api
  repos:
  - github:acme/checkout
  k8s_namespace: shop
  k8s_selector: app=checkout-api
world:
  postgres.activity:
    result:
      database: orders
      total: 470
      max_connections: 500
      by_state:
        active: 150
        idle in transaction: 320
      idle_in_transaction: 320
      waiting: 0
      oldest_xact_age_s: 1820.0
  postgres.locks:
    result:
      database: orders
      blocked: 0
      blockers: []
  changes.recent:
    result:
      window_min: 180
      changes:
      - source: github
        kind: deploy
        ref: a1b2c3
        at: '2026-01-01T00:00:00+00:00'
        minutes_ago: 150
        actor: null
        environment: shop
      count: 1
truth:
  classification: database/saturation
  severity: P2
  root_cause: pg_idle_in_transaction_leak
  verdict: SUPPORTED
  must_cite:
  - postgres.activity
  must_not_claim:
  - pg_connection_load
  - recent_rollout
why: '320 of 500 connections sit idle in a transaction for 30 minutes: a leak, not load. The 2.5-hour-old deploy
  is a trap.'
