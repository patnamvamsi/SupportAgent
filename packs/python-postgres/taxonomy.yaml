# App-layer labels for Python services (the database ones, app/memory and
# app/config are in common since v2.0.0).
version: 2.0.0
labels:
  - id: app/worker_timeout
    description: >-
      Web workers (gunicorn, uvicorn) time out or are killed mid-request; requests
      hang or return 502/504 while the process itself stays up.
  - id: queue/backlog
    description: >-
      A task queue (Celery, RQ) backs up: tasks wait far longer than usual and
      consumers fall behind producers.
  - id: edge/certificate
    description: >-
      TLS fails: an expired or untrusted certificate on the service or on an
      upstream it calls.
