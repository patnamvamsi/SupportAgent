# Lab scenario (ADR-0011 §5, ADR-0022 §3). Edit only with a `why` note.
id: compose-control-down
pack: docker-compose
split: tune
description: 'Control: a user reports the service down, but its container is running and the host has
  been up for weeks.'
incident:
  subject: billing-api down?
  body: A user says billing-api is down. Nothing else looks wrong.
  priority: '3'
service:
  name: billing-api
  stack:
  - docker-compose
  - python
world:
  metrics.query:
    result:
      query: max(time() - max_over_time(container_last_seen{service="billing-api"}[1d]))
