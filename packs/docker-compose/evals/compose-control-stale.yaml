# Lab scenario (ADR-0011 §5, ADR-0022 §3). Edit only with a `why` note.
id: compose-control-stale
pack: docker-compose
split: holdout
description: 'Control: data looks stale to a user, but the writer is logging normally.'
incident:
  subject: data looks stale
  body: The dashboard looks stale to me, are the prices updating?
  priority: '3'
service:
  name: price-writer
  stack:
  - docker-compose
  - python
