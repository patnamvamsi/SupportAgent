# One probe per hypothesis. Container metrics come from cAdvisor and host
# metrics from node-exporter, with the Compose service as the `service`
# label (docker/observability/exporters/scrape.yml relabels it).
probes:
  compose_host_restart:
    tool: metrics.query
    args: {query: "min(time() - node_boot_time_seconds)"}
    check: 'result.query.contains("node_boot_time") && result.count > 0 && double(result.max_value) < 21600.0'
  compose_crash_loop:
    tool: metrics.query
    args:
      query: 'max(changes(container_start_time_seconds{service="{{service}}"}[30m]))'
      service: "$service.name"
    check: 'result.query.contains("container_start_time") && double(result.max_value) >= 3.0'
  compose_container_down:
    tool: metrics.query
    args:
      query: 'max(time() - max_over_time(container_last_seen{service="{{service}}"}[1d]))'
      service: "$service.name"
    check: 'result.query.contains("container_last_seen") && result.count > 0 && double(result.max_value) > 120.0'
  compose_stalled:
    tool: logs.search
    args:
      query: '{service="{{service}}"}'
      service: "$service.name"
      window_min: 30
    check: 'result.query.contains("{service=") && result.count == 0'
