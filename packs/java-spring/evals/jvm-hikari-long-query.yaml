# Lab scenario (ADR-0011 §5, WP-O6a). Edit only with a `why` note.
id: jvm-hikari-long-query
pack: java-spring
split: tune
description: A report query holds connections for minutes; the pool has none left for checkout.
incident:
  subject: Checkout failing intermittently
  priority: '2'
  body: Intermittent 503s from checkout-api; requests wait about 30s, then fail.
service:
  name: checkout-api
  stack:
  - java
  - spring-boot
world:
  logs.search:
    result:
      query: '{service="checkout-api"}'
      window_min: 60
      count: 6
      matches:
      - ts: '2026-01-01T07:10:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
      - ts: '2026-01-01T07:11:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
      - ts: '2026-01-01T07:12:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
      - ts: '2026-01-01T07:13:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
      - ts: '2026-01-01T07:14:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
      - ts: '2026-01-01T07:15:00Z'
        line: HikariPool-2 - Connection is not available, request timed out after 30000ms.
        labels:
          service: checkout-api
  metrics.query:
    result:
      query: max(tomcat_threads_busy_threads{service="checkout-api"} / tomcat_threads_config_max_threads{service="checkout-api"})
      series:
      - labels: {}
        value: 0.71
      count: 1
      max_value: 0.71
truth:
  classification: database/saturation
  also_acceptable:
  - request/capacity
  severity: P2
  root_cause: jvm_connection_pool_exhaustion
  verdict: SUPPORTED
  must_cite:
  - logs.search
why: Six 'Connection is not available' timeouts in the window; the worker threads are not the bottleneck (71%).
