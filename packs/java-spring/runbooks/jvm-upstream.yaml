# A Spring service's calls to a third party fail or time out. Spring's HTTP
# clients log the URL they called, so the provider is named in the evidence.
id: runbook:jvm-upstream
applies_when: {classification: network/outage}
budget: {max_tool_calls: 5, max_tokens: 3000, max_hypotheses: 3}
steps:
  - id: outbound
    hypothesis: upstream_provider
    tool: logs.search
    args:
      query: '{service="{{service}}"} |~ "I/O error on (GET|POST|PUT) request for|ResourceAccessException|ReadTimeoutException"'
      service: "$service.name"
      window_min: 60
    check: 'size(result.matches.filter(m, m.line.contains("I/O error on") || m.line.contains("ResourceAccessException") || m.line.contains("ReadTimeoutException"))) >= 3'
